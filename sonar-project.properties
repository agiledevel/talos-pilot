# CI-based SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
# Automatic Analysis must stay disabled for this project; both cannot run together.
sonar.organization=agiledevel
sonar.projectKey=agiledevel_talos-pilot
sonar.projectName=Talos Pilot
sonar.sourceEncoding=UTF-8

# Tests are colocated with renderer and automation sources.
sonar.sources=src,scripts,src-tauri/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.tests=src,scripts,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*.spec.ts

# Produced by `pnpm test:coverage` before the scan.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fail the scan step unless the quality gate passes within ten minutes.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
