name: Build release assets

# One packaging recipe for both callers. Release preview and package
# qualification call this workflow with an already validated immutable revision
# and package version; neither can change the targets, hooks, configuration or
# upload shape. Only the release workflow can publish, and it still depends on
# QA, security, native and this asset matrix.

on:
  workflow_call:
    inputs:
      revision:
        description: Full commit SHA already resolved by the caller
        required: true
        type: string
      version:
        description: Package version validated for that revision
        required: true
        type: string
      mode:
        description: release or qualification
        required: true
        type: string
      tag:
        description: Existing release tag in release mode; empty for qualification
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  assets:
    name: Build ${{ matrix.target }} assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REVISION: ${{ inputs.revision }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
      RELEASE_SOURCE_REF: ${{ github.ref }}
      RELEASE_SOURCE_EVENT: ${{ github.event_name }}
      RELEASE_WORKFLOW_NAME: ${{ github.workflow }}
      RELEASE_WORKFLOW_PATH: ${{ github.workflow_ref }}
      RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
      RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      RELEASE_SERVER_URL: ${{ github.server_url }}
      # The helper and the Rust binary embed this exact commit, not the
      # controller's GITHUB_SHA, which can differ for a dispatched run.
      TALOS_PILOT_BUILD_ID: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify the checked-out source
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_REVISION" ]; then
            echo "the checkout $head is not the requested revision $RELEASE_REVISION" >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Linux package prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-prerequisites
        with:
          mode: release
      - name: Fetch the pinned AppImage runtime
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 --max-time 60 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o "$RUNNER_TEMP/appimage-runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/appimage-runtime-x86_64" | sha256sum --check
          printf 'LDAI_RUNTIME_FILE=%s\n' "$RUNNER_TEMP/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }}
      - uses: ./.github/actions/install-protoc
      - run: pnpm icons:check
      - name: Build preview packages
        # PowerShell/pnpm command forwarding dropped the Cargo separator on
        # Windows. Invoke the pinned Node CLI directly from bash on every OS.
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --config .github/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Check packaged Linux resources
        if: runner.os == 'Linux'
        run: pnpm release:check-linux
      # The Linux installers are inspected privately in a temporary directory:
      # the DEB payload is the installer evidence for the generated notices, and
      # all three payloads must contain only declared programs. Nothing is
      # installed on the runner and no file is removed from a completed package.
      - name: Inspect packaged Linux payloads
        id: linux_payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          shopt -s nullglob

          packages=("$bundle"/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          mkdir "$work/deb"
          (
            cd "$work/deb"
            ar x "$package"
            tar -xf data.tar.*
          )
          node scripts/check-payload.ts --platform linux-deb --root "$work/deb"
          pnpm notices:check-packaged -- "$work/deb/usr/lib/Talos Pilot/legal"

          packages=("$bundle"/rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          mkdir "$work/rpm"
          bash scripts/extract-rpm.sh "$package" "$work/rpm"
          node scripts/check-payload.ts --platform linux-rpm --root "$work/rpm"

          packages=("$bundle"/appimage/*.AppImage)
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          mkdir "$work/appimage"
          (
            cd "$work/appimage"
            "$package" --appimage-extract > /dev/null
          )
          node scripts/prepare-appimage-reference.ts --root "$work/appimage/squashfs-root" \
            --directory "$work/appimage/reference"
          node scripts/check-payload.ts --platform linux-appimage --root "$work/appimage/squashfs-root" \
            --appimage-system-root "$work/appimage/reference"
      # Never upload these failed bytes under release-* or feed them to a
      # release collector. They are diagnosis only, retained for one day.
      - name: Bound failed Linux AppImage diagnostic
        id: linux_diagnostic
        if: failure() && runner.os == 'Linux' && steps.linux_payload.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          test "$(stat -c '%s' "${images[0]}")" -le 268435456
          sha256sum "${images[0]}"
      - name: Preserve failed Linux AppImage for diagnosis
        if: failure() && runner.os == 'Linux' && steps.linux_diagnostic.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-appimage-${{ inputs.revision }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1
      - name: Inspect the macOS app payload
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-payload.ts --platform macos-app \
            --root "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Talos Pilot.app"
      # The Windows NSIS payload needs an installer extraction that this build
      # step does not perform, so the ordinary release output stands in for the
      # exclusion check there; F9-08 inspects the actual installers.
      - name: Check the release output programs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-payload.ts \
            --release-output "src-tauri/target/${{ matrix.target }}/release" \
            --target "${{ matrix.target }}"
      - run: pnpm release:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
