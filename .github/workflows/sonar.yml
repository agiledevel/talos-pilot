name: SonarCloud quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          # Full history lets SonarCloud attribute new code and blame accurately.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Generate renderer and automation coverage
        run: pnpm test:coverage
      # sonar-project.properties sets sonar.qualitygate.wait, so a failed or
      # expired quality gate fails this step. A missing token also fails it.
      - name: Analyze and require the quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
