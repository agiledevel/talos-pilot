name: SonarCloud quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read
  checks: read

jobs:
  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Require the installed app's successful analysis
        run: node scripts/sonar-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANALYSIS_SHA: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
          SONAR_CHECK_NAME: ${{ vars.SONAR_CHECK_NAME }}
