name: Native tests

on:
  workflow_call:
    inputs:
      revision:
        description: Exact revision the release qualification tests
        type: string
        required: true
  workflow_dispatch:
    inputs:
      revision:
        description: Branch, tag, or commit SHA to test; defaults to the selected ref
        required: false
        type: string
  schedule:
    # Weekly native scan so drift is detected without blocking pull requests.
    - cron: "23 3 * * 1"

permissions:
  contents: read

# Calls for the same revision are serialised, not cancelled; evidence for a
# release or an explicitly selected revision must finish.
concurrency:
  group: native-tests-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The desktop matrix needs up to about 57 minutes without a dependency
    # cache; the native suite and its build add a bounded margin.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    env:
      RUSTDOCFLAGS: -D warnings
      TALOS_PILOT_BUILD_ID: ${{ inputs.revision || github.sha }}
      # A clean runner recompiles every first-party crate, so incremental state
      # is never reused. Line tables keep test backtraces useful while shrinking
      # the cached dependency artifacts.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-prerequisites
        with:
          mode: native
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/install-protoc
      # The native suite builds the test application and its synthetic API
      # example, so this workflow owns a separate dependency cache.
      - name: Restore the native Cargo cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: native-v2-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/.cargo/config.toml') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            native-v2-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/.cargo/config.toml') }}-
            cargo-v2-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/.cargo/config.toml') }}-
            ${{ hashFiles('src-tauri/.cargo/config.toml') == '' && format('native-v1-{0}-{1}', matrix.os, hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock')) || '' }}
            ${{ hashFiles('src-tauri/.cargo/config.toml') == '' && format('cargo-v1-{0}-{1}', matrix.os, hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock')) || '' }}
      - name: Run the native Tauri suite
        shell: bash
        run: |
          mkdir -p native-evidence
          set -o pipefail
          pnpm test:native 2>&1 | tee "native-evidence/native-${{ runner.os }}.log"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence-${{ matrix.os }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
      # Save only after the test build produced the release executable, so an
      # early dependency failure cannot publish a partial cache. First-party
      # artifacts are removed first, leaving one dependency build per lockfile.
      - name: Drop first-party artifacts before the cache save
        id: native-prune
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' && hashFiles('src-tauri/target/release/talos-pilot*') != '' }}
        shell: bash
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml --locked --package talos-pilot
          cargo clean --manifest-path src-tauri/Cargo.toml --locked --package talos-pilot --release
          # A seed from deterministic CI also contains debug tests/Clippy.
          # This workflow builds only release targets, so do not duplicate them.
          rm -rf src-tauri/target/debug src-tauri/target/doc
      - name: Save the native Cargo cache
        if: ${{ !cancelled() && steps.native-prune.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
