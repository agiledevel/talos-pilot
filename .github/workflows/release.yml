name: Release preview

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      revision: ${{ steps.metadata.outputs.revision }}
      range: ${{ steps.metadata.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.0 --profile minimal
      - id: metadata
        run: node scripts/release-metadata.ts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  qa:
    needs: source
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.source.outputs.revision }}

  sonar:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/sonar.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  assets:
    name: Build ${{ matrix.target }} assets
    needs: [source, qa, sonar]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libxdo-dev build-essential pkg-config librsvg2-dev patchelf libfuse2 rpm
      - name: Fetch the pinned AppImage runtime
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 --max-time 60 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o "$RUNNER_TEMP/appimage-runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/appimage-runtime-x86_64" | sha256sum --check
          printf 'LDAI_RUNTIME_FILE=%s\n' "$RUNNER_TEMP/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - run: pnpm icons:check
      - name: Build preview packages
        run: pnpm tauri build --ci --config .github/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Check packaged Linux resources
        if: runner.os == 'Linux'
        run: pnpm release:check-linux
      - run: pnpm release:assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft prerelease
    needs: [source, qa, sonar, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate Angular commit release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ needs.source.outputs.range }} --output release-notes.md
      - name: Attach notes and create the reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.revision }}
        run: |
          cat docs/release-preview.md release-notes.md > release-assets/CHANGELOG.md
          cat release-assets/*-SHA256SUMS.txt > release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --target "$RELEASE_SHA" --draft --prerelease --title "Talos Pilot $RELEASE_TAG — foundation preview" --notes-file release-assets/CHANGELOG.md
