name: Release preview

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      range: ${{ steps.metadata.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.99.1 --profile minimal
      - id: metadata
        run: node scripts/release-metadata.ts
        env:
          RELEASE_MODE: release
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

  qa:
    needs: source
    # The called workflow's scope job reads earlier workflow runs.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.source.outputs.revision }}

  security:
    needs: source
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      revision: ${{ needs.source.outputs.revision }}

  native:
    needs: source
    # Native qualification runs on all four desktop runners for the exact
    # revision. Compilation may overlap it; the draft cannot publish until it passes.
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with:
      revision: ${{ needs.source.outputs.revision }}

  assets:
    # The same shared recipe the tag-free qualification wrapper calls.
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/build-assets.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      version: ${{ needs.source.outputs.version }}
      mode: release
      tag: ${{ needs.source.outputs.tag }}

  draft:
    name: Create draft prerelease
    needs: [source, qa, security, native, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate Angular commit release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: ${{ needs.source.outputs.range }} --output release-notes.md
      - name: Attach notes and create the reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.revision }}
        run: |
          cat docs/release-preview.md release-notes.md > release-assets/CHANGELOG.md
          cat release-assets/*-SHA256SUMS.txt > release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --target "$RELEASE_SHA" --draft --prerelease --title "Talos Pilot $RELEASE_TAG — foundation preview" --notes-file release-assets/CHANGELOG.md
