[package]
name = "talos-pilot"
version = "0.1.0"
description = "Talos and Kubernetes desktop management"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "talos-pilot"

[features]
default = []
native-test = [
  "dep:rcgen",
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "dep:tokio-rustls",
]

[build-dependencies]
prost-build = "=0.14.4"
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
getrandom = "=0.4.3"
futures-util = { version = "=0.3.34", default-features = false, features = ["io"] }
http = "=1.5.0"
http-body = "=1.1.0"
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_36"] }
kube = { version = "=4.2.0", default-features = false, features = [
  "client",
  "config",
  "ring",
  "rustls-tls",
  "runtime",
] }
pem = "=3.0.6"
prost = "=0.14.4"
rcgen = { version = "=0.14.10", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
thiserror = "=2.0.21"
tower = { version = "=0.5.3", default-features = false }
tokio = { version = "=1.53.2", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
], optional = true }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
url = "=2.5.8"
zeroize = "=1.9.1"

[dev-dependencies]
rcgen = "=0.14.10"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }

[[example]]
name = "kubernetes-synthetic-apiserver"
required-features = ["native-test"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = [
  "crypto-rust",
  "sync-secret-service",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
