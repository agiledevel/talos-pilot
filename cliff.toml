# Generated CHANGELOG.md and release notes use the same pinned git-cliff configuration.
[changelog]
header = """
# Changelog

Generated from Angular semantic commits with git-cliff. Do not edit generated entries by hand.

"""
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/agiledevel/talos-pilot/commit/{{ commit.id }}))
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|ci)", group = "Build and CI" },
  { message = "^test", group = "Tests" },
  { message = "^refactor", group = "Refactoring" },
  { message = ".*", group = "Maintenance" },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)\\.[0-9]+)?$"
sort_commits = "oldest"
